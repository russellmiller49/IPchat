version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bronchmonkey-db
    environment:
      POSTGRES_USER: rm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: medical_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rm -d medical_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: bronchmonkey-api
    environment:
      IPCHAT_EDITION: full
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      IPCHAT_INFRA__SQL_CONNECTION_STRING: postgresql://rm:@postgres/medical_rag
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["ipchat", "run", "--edition", "full", "--ui", "api"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: bronchmonkey-ui
    environment:
      IPCHAT_EDITION: full
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"
    command: ["ipchat", "run", "--edition", "full", "--ui", "streamlit"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:

networks:
  default:
    name: bronchmonkey-network