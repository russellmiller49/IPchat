version: '3.8'

services:
  bronchmonkey-lite:
    build:
      context: ..
      dockerfile: docker/Dockerfile.lite
    container_name: bronchmonkey-lite
    environment:
      IPCHAT_EDITION: lite
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data:ro  # Mount data as read-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped